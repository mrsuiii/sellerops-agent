# Cloud CUDA environment; keep the Mac environment.yml unchanged.
# Audit nvidia-smi/driver compatibility before creating this environment.
# PyTorch's Linux pip distribution supplies CUDA runtime dependencies;
# the host must provide a compatible NVIDIA driver.
name: llm-post-training
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.13
  - pip
  - numpy>=2.2,<3
  - ipykernel
  - nbconvert
  - nbformat
  - pip:
      - torch==2.13.0
      - transformers==5.14.1
      - datasets==5.0.0
      - accelerate==1.14.0
